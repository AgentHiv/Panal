# Que Caddy vuelva solo y no se lleve a tu agente por delante si se queda sin memoria.
#
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/caddy-resiliencia.conf /etc/systemd/system/caddy.service.d/resiliencia.conf
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
# Ajústalo a tu máquina: bastante menos que la memoria total.
MemoryMax=4G
# Y un poco antes de ese tope, el runtime de Go aprieta su recolector de basura.
Environment=GOMEMLIMIT=3GiB
