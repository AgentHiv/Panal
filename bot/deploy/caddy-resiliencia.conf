# Copiar a /etc/systemd/system/caddy.service.d/resiliencia.conf (ver HTTPS.md).
#
# El 30-oct-2026 el kernel mató a Caddy por falta de memoria y, sin esto, siguió
# caído casi una hora hasta que alguien lo levantó a mano.
[Unit]
# Sin límite de intentos: tras una avalancha, debe volver en cuanto pueda.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
# Muere Caddy antes que el buzón o el indexador, que comparten máquina (7,9 GB).
MemoryMax=4G
# Y antes de llegar a ese tope, el runtime de Go aprieta su recolector de basura.
Environment=GOMEMLIMIT=3GiB
