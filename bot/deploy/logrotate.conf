# Panal — rotación por fecha de los registros de la máquina del buzón y del
# indexador (api.panal.lat).
#
#   sudo cp bot/deploy/logrotate.conf /etc/logrotate.d/panal
#   sudo logrotate -d /etc/logrotate.d/panal    (en seco: dice qué haría y no toca nada)
#
# El temporizador `logrotate.timer` del sistema ya lo pasa cada noche: no hay
# nada que instalar.
#
# POR QUÉ. La política de privacidad promete que los registros con IP se borran
# como mucho a los 90 días. Hasta noviembre de 2026 no rotaba nada de pm2, y el
# registro de acceso de Caddy rotaba por tamaño (100 MiB), no por fecha: con poco
# tráfico, el archivo abierto podía pasar de los 90 días sin saltar nunca. Aquí
# todo rota cada día y se guardan 30: nada pasa de un mes.
#
# copytruncate y no create: pm2 y Caddy tienen los archivos abiertos en modo
# añadir y no los vuelven a abrir al rotar, así que con create seguirían
# escribiendo en el archivo ya movido. copytruncate copia y vacía el mismo
# archivo; puede perder las líneas que entren en ese instante, y para estos
# registros vale.
#
# Los archivos de Caddy van por su nombre y no con *.log: el roll de Caddy
# (roll_size) se queda, y sus copias —acceso-<fecha>.log— las borra él mismo a
# los 7 días; un *.log las rotaría otra vez.

/root/.pm2/pm2.log /root/.pm2/logs/*.log {
	daily
	rotate 30
	maxage 31
	missingok
	notifempty
	compress
	delaycompress
	copytruncate
	sharedscripts
	# Al borrar y volver a crear un proceso, pm2 le da otro número y escribe en
	# otro archivo (panal-lint-out-0.log pasa a panal-lint-out-9.log). Las copias
	# del viejo ya no las poda nadie: logrotate solo borra las de un archivo
	# cuando lo rota, y uno vacío no lo rota. Esto las borra al mes, sean de quien
	# sean.
	lastaction
		find /root/.pm2/logs -name '*.log.*' -mtime +31 -delete
	endscript
}

# /var/log/caddy es de caddy: sin `su`, logrotate se niega a tocarla.
/var/log/caddy/acceso.log /var/log/caddy/errores.log {
	su caddy caddy
	daily
	rotate 30
	maxage 31
	missingok
	notifempty
	compress
	delaycompress
	copytruncate
}
