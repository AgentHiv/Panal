apply plugin: 'com.android.application'

android {
    namespace = "lat.panal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "lat.panal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * La version sale de la ETIQUETA, no de este archivo.
         *
         * Estaba clavada en 1 / "1.0" y se publicaron asi apk-v1.0.0, v1.0.1 y
         * v1.1.0: tres releases distintas que por dentro decian ser la misma.
         * Eso no es cosmetico. Android decide si un APK es una ACTUALIZACION
         * comparando `versionCode`, asi que con el mismo numero instalar la
         * nueva encima de la vieja no es actualizar: segun el fabricante o
         * reinstala en silencio o falla con "aplicacion no instalada", que no
         * menciona versiones por ningun lado. Y en Ajustes las tres salian como
         * "1.0", asi que nadie —tu incluido, cuando alguien reporte un fallo—
         * podia saber cual tenia delante.
         *
         * `VERSION_CODE` y `VERSION_NAME` los pone el workflow a partir de la
         * etiqueta. Sin ellas (compilando a mano) sale 1 / "0.0-dev", que se
         * distingue de un vistazo de cualquier version publicada.
         */
        versionCode System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") ?: "0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Firma v1 ADEMAS de v2.
     *
     * Con `minSdk >= 24` el plugin de Gradle desactiva la v1 por su cuenta: da
     * por hecho que cualquier telefono que llegue a instalar esto entiende la
     * v2, y sobre el papel es correcto. En la practica es una causa conocida de
     * "app no instalada, error en el paquete" en fabricantes con su propio
     * verificador, y ahi el mensaje no dice nada de firmas: parece un archivo
     * corrupto.
     *
     * Activarla cuesta unos kilobytes y quita de en medio una clase entera de
     * fallos que no se pueden diagnosticar desde fuera del telefono.
     */
    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }

        /**
         * LA CLAVE ESTABLE. Es lo que decide si una version nueva se puede
         * INSTALAR ENCIMA de la anterior o no.
         *
         * Esto no es teoria. Los APK publicados vienen firmados cada uno con
         * una clave distinta, y se puede comprobar en los propios archivos:
         *
         *   panal-apk-v1.0.1.apk  ->  85:42:A9:24:A0:F0:2F:75:EA:AE:51:BD...
         *   panal-apk-v1.1.0.apk  ->  15:82:CC:53:A8:B6:E7:60:56:92:9C:C0...
         *
         * Los dos dicen "CN=Android Debug" y los dos se crearon con minutos de
         * diferencia (20 y 21 de agosto). El motivo: sin `storeFile`, Gradle
         * firma con `~/.android/debug.keystore`, y en un runner de GitHub ese
         * archivo NO EXISTE al empezar, asi que se genera uno nuevo con una
         * clave nueva en cada ejecucion.
         *
         * Android compara la firma antes de actualizar. Si no es la misma
         * clave, no considera que sea la misma app: rechaza la instalacion con
         * "conflicto con un paquete existente" o "aplicacion no instalada", que
         * no menciona firmas por ningun lado y parece un archivo corrupto o un
         * problema de espacio. La unica salida para quien lo sufre es
         * desinstalar —perdiendo el llavero cifrado del telefono— y volver a
         * instalar.
         *
         * Con una clave fija, esa clase entera de fallo desaparece: todas las
         * versiones futuras se actualizan encima de las anteriores.
         *
         * DE DONDE SALE LA CLAVE. De variables de entorno, no del repositorio.
         * Un almacen de firma dentro de un repositorio publico es una clave
         * publica: cualquiera podria firmar un APK que Android aceptaria como
         * actualizacion de Panal, heredando los datos de la app —incluido el
         * llavero cifrado—. El flujo lo saca de un secreto del repositorio
         * (`PANAL_KEYSTORE_B64`), lo escribe fuera del arbol y pasa la ruta por
         * aqui.
         *
         * Sin esas variables no se define nada y `assembleDebug` sigue
         * funcionando como siempre. Compilar a mano no necesita ningun secreto.
         */
        if (System.getenv("PANAL_KEYSTORE")) {
            release {
                storeFile file(System.getenv("PANAL_KEYSTORE"))
                storePassword System.getenv("PANAL_KEYSTORE_PASS")
                keyAlias System.getenv("PANAL_KEY_ALIAS") ?: "panal"
                // En un PKCS12 la clave y el almacen comparten contrasena: Java
                // no admite otra cosa, y pedir dos seria inventarse un ajuste
                // que no existe.
                keyPassword System.getenv("PANAL_KEYSTORE_PASS")
                storeType "PKCS12"
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("PANAL_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
