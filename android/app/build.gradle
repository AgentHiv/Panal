apply plugin: 'com.android.application'

android {
    namespace = "lat.panal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "lat.panal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * La version sale de la ETIQUETA, no de este archivo.
         *
         * Estaba clavada en 1 / "1.0" y se publicaron asi apk-v1.0.0, v1.0.1 y
         * v1.1.0: tres releases distintas que por dentro decian ser la misma.
         * Eso no es cosmetico. Android decide si un APK es una ACTUALIZACION
         * comparando `versionCode`, asi que con el mismo numero instalar la
         * nueva encima de la vieja no es actualizar: segun el fabricante o
         * reinstala en silencio o falla con "aplicacion no instalada", que no
         * menciona versiones por ningun lado. Y en Ajustes las tres salian como
         * "1.0", asi que nadie —tu incluido, cuando alguien reporte un fallo—
         * podia saber cual tenia delante.
         *
         * `VERSION_CODE` y `VERSION_NAME` los pone el workflow a partir de la
         * etiqueta. Sin ellas (compilando a mano) sale 1 / "0.0-dev", que se
         * distingue de un vistazo de cualquier version publicada.
         */
        versionCode System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") ?: "0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Firma v1 ADEMAS de v2.
     *
     * Con `minSdk >= 24` el plugin de Gradle desactiva la v1 por su cuenta: da
     * por hecho que cualquier telefono que llegue a instalar esto entiende la
     * v2, y sobre el papel es correcto. En la practica es una causa conocida de
     * "app no instalada, error en el paquete" en fabricantes con su propio
     * verificador, y ahi el mensaje no dice nada de firmas: parece un archivo
     * corrupto.
     *
     * Activarla cuesta unos kilobytes y quita de en medio una clase entera de
     * fallos que no se pueden diagnosticar desde fuera del telefono.
     */
    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
