# Paquetes publicables del monorepo. `bot/` queda fuera a proposito: tiene su
# propio lockfile y su propio ciclo, y no se publica.
packages:
  - 'sdk'
  - 'mcp'
  - 'create-agent'

# pnpm 11 bloquea por defecto los scripts de instalación de las dependencias.
# Estas cuatro los necesitan para colocar sus binarios nativos; sin esto,
# `pnpm install` termina en ERR_PNPM_IGNORED_BUILDS y `pnpm build` no arranca.
allowBuilds:
  esbuild: true # bundler que usa Vite
  keccak: true # hashing nativo (viem / web3)
  bufferutil: true # aceleración de WebSocket
  utf-8-validate: true

# Los paquetes de aqui se enlazan entre si en desarrollo. Sin esto, pnpm resuelve
# `@panal/sdk` DESDE NPM aunque este al lado, y el mcp se compila contra la
# version publicada: un campo nuevo en el sdk no existe para el hasta que se
# publica, que es justo al reves de como se trabaja.
#
# No afecta a lo que se publica: las dependencias siguen siendo rangos normales
# (`^0.8.0`) y NO `workspace:`, que es un protocolo de pnpm que `npm publish` no
# traduce —asi se colo literal en panal-mcp@0.3.1 y dejo el paquete
# ininstalable—.
#
# Va aqui y no en .npmrc porque pnpm 11 ya no lee de alli las opciones suyas.
linkWorkspacePackages: true

# WalletConnect arrastra `pino@7.11.0` por debajo, que tiene una
# vulnerabilidad conocida. El propio conector de wagmi lo dice en su JSDoc y
# pide este override: no lo arreglan ellos porque
# `@walletconnect/ethereum-provider` cambió de licencia y no pueden actualizarlo
# sin arrastrar la nueva.
#
# Se comprueba con `pnpm why pino`: si vuelve a salir un 7.x, este override se
# ha quedado atrás y la cadena entró por otro sitio.
overrides:
  '@walletconnect/logger>pino': '10.0.0'

minimumReleaseAgeExclude:
  - '@panal/sdk@0.7.0'
