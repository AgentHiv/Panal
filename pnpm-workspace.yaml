# Paquetes publicables del monorepo. `bot/` queda fuera a proposito: tiene su
# propio lockfile y su propio ciclo, y no se publica.
packages:
  - 'sdk'
  - 'mcp'
  - 'create-agent'
  # La app de Android. No se publica: esta aqui para que pnpm le enlace el sdk
  # del repo en vez de bajarse el de npm, igual que a los demas.
  - 'movil'

# pnpm 11 bloquea por defecto los scripts de instalación de las dependencias.
# Estas cuatro los necesitan para colocar sus binarios nativos; sin esto,
# `pnpm install` termina en ERR_PNPM_IGNORED_BUILDS y `pnpm build` no arranca.
allowBuilds:
  esbuild: true # bundler que usa Vite
  keccak: true # hashing nativo (viem / web3)
  bufferutil: true # aceleración de WebSocket
  utf-8-validate: true

# Los paquetes de aqui se enlazan entre si en desarrollo. Sin esto, pnpm resuelve
# `@panal/sdk` DESDE NPM aunque este al lado, y el mcp se compila contra la
# version publicada: un campo nuevo en el sdk no existe para el hasta que se
# publica, que es justo al reves de como se trabaja.
#
# No afecta a lo que se publica: las dependencias siguen siendo rangos normales
# (`^0.8.0`) y NO `workspace:`, que es un protocolo de pnpm que `npm publish` no
# traduce —asi se colo literal en panal-mcp@0.3.1 y dejo el paquete
# ininstalable—.
#
# Va aqui y no en .npmrc porque pnpm 11 ya no lee de alli las opciones suyas.
linkWorkspacePackages: true

# AQUI NO VA UN OVERRIDE DE `pino`. Y hace falta explicarlo, porque el propio
# JSDoc del conector de wagmi pide uno y parece lo correcto.
#
# WalletConnect arrastra `pino@7.11.0`, que tiene una vulnerabilidad conocida, y
# wagmi recomienda forzar `'@walletconnect/logger>pino': '10.0.0'`. Se hizo, y
# ROMPIO WalletConnect entero en el navegador con este error:
#
#     r.bindings is not a function
#
# El motivo esta en `@walletconnect/logger@2.1.2`, que resuelve el contexto asi:
#
#     typeof r.bindings > "u" ? contextoDelNavegador(r) : r.bindings().context
#
# Mira si `bindings` EXISTE y, si existe, lo LLAMA. El logger de navegador de
# pino 7 no lo tiene y toma el otro camino; el de pino 8, 9 y 10 lo expone como
# PROPIEDAD y no como funcion, asi que lo llama y revienta. Comprobado en las
# tres versiones: ninguna sirve con este logger.
#
# La salida limpia seria subir `@walletconnect/logger` a 3.x, que ya viene hecho
# para pino 10 — pero es un salto de major en una dependencia transitiva del
# camino por el que se cobra, y eso pesa mas que una vulnerabilidad en un
# logger. Se queda como estaba antes de tocarlo.

minimumReleaseAgeExclude:
  - '@panal/sdk@0.7.0'

# Versiones forzadas por seguridad (2026-10-08, `pnpm audit --prod`). Ninguna la
# usa Panal directamente: entran por las librerías de wallet —el SDK de Coinbase
# trae axios, viem/isows trae ws— y ahí esperan a que su autor las suba.
#   - axios < 1.20: varias de gravedad alta (DoS, prototype pollution, proxy).
#   - ws 8.0–8.21: DoS por agotamiento de memoria.
# Quitar de aquí cuando las dependencias que las traen ya pidan versiones buenas.
#
# Añadidas el 2026-10-30 (las 7 alertas de Dependabot de ese día):
#   - follow-redirects 1.16.0 (axios): dos altas, cabeceras con credenciales que
#     pasan a otro origen al seguir una redirección. 1.16.2 cabe en el rango de axios.
#   - postcss-selector-parser 6.1.4 (Tailwind): selectores que cuestan tiempo
#     cuadrático. 6.1.5 cabe en su rango, y solo corre al compilar el CSS.
#   - uuid 7, 8 y 9 (MetaMask SDK, y xcode por la CLI de Capacitor): salto a 11,
#     que exporta lo mismo (`v4` desde la raíz del paquete, que es lo único que usan).
# Ninguna de estas tres entra en lo que se descarga la web o el APK: lo comprueban
# los source maps del build. Se suben porque es gratis, no porque corriera peligro.
#
# Y dos que se quedan como están, a propósito:
#   - zod 3 (abitype viejo, SDK de Coinbase, AppKit de Reown, que fija 3.22.4 aun
#     en su última versión): el arreglo solo existe en zod 4, que cambia la API.
#   - decode-uri-component 0.2.2 (query-string 7, de WalletConnect): el arreglo
#     es 0.5.1, que ya es solo ESM, y query-string 7 lo carga con `require`.
# Tampoco entran en el bundle —WalletConnect se empaqueta sin query-string y nadie
# del bundle usa zod—, así que forzarlas rompería librerías para nada.
overrides:
  axios: ^1.20.0
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  'follow-redirects@<1.16.2': ^1.16.2
  'postcss-selector-parser@>=6.0.0 <6.1.5': ^6.1.5
  'uuid@<11.1.1': ^11.1.1
