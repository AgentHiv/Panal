# Panal — la foto del mes
#
# ROADMAP.md lo pide como regla: el último día de cada mes, las cifras del
# mercado entran en el repositorio (`metrics/`). Esto lo hace sin que nadie
# tenga que acordarse.
#
# CUÁNDO. El día 1 a las 00:30 UTC, y otra vez el día 2 por si la primera no
# llega a correr: GitHub retrasa los cron horas en días de carga, y el de
# septiembre arrancó con tres de retraso. Ya no importa a qué hora corra: el
# script lee la cadena en el último bloque del mes que acaba de terminar, así
# que las dos ejecuciones escriben el mismo archivo y la segunda no hace commit.
# A mano (`workflow_dispatch`) saca la de un mes concreto, siempre que sea de
# los últimos ~5 días: más atrás, el RPC de Monad ya no sirve ese estado.
#
# DÓNDE ESCRIBE. En la rama `metrics/AAAA-MM`, y abre un aviso con el enlace para
# abrir el PR. Hasta octubre de 2026 hacía commit directo a `main`, y desde que
# `main` exige PR (regla del 8 de octubre) el push fallaba: la foto de octubre no
# se guardó y hubo que sacarla a mano antes de que el RPC perdiera ese estado.
# El PR no lo abre este flujo: uno abierto con su token no lanzaría los checks
# obligatorios y no se podría fusionar. Abierto por una persona, sí.

name: Foto del mes

on:
  schedule:
    - cron: '30 0 1 * *'
    - cron: '30 0 2 * *'
  workflow_dispatch:
    inputs:
      mes:
        description: 'AAAA-MM (vacío = el mes que acaba de terminar)'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  foto:
    name: Sacar la foto del mes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Qué mes?
        id: toca
        env:
          MES: ${{ inputs.mes }}
        run: |
          if [ -z "$MES" ]; then
            MES=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          fi
          # Va a una línea de comandos y al mensaje del commit: solo AAAA-MM.
          if ! printf '%s' "$MES" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
            echo "«$MES» no es un mes AAAA-MM." >&2
            exit 1
          fi
          echo "mes=$MES" >> "$GITHUB_OUTPUT"
          echo "La foto de $MES."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Sin `version:` a propósito: la lee del campo `packageManager`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Sacar la foto
        run: pnpm foto -- --mes ${{ steps.toca.outputs.mes }}

      - name: Guardarla en su rama y avisar
        env:
          MES: ${{ steps.toca.outputs.mes }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "panal-foto"
          git config user.email "panal-foto@users.noreply.github.com"
          git add metrics/
          if git diff --cached --quiet; then
            echo "La foto no cambió nada: ya estaba en main."
            exit 0
          fi
          RAMA="metrics/$MES"
          git commit -m "metrics: snapshot for $MES"
          # La segunda ejecución del mes escribe lo mismo: si la rama ya lo tiene,
          # no se avisa otra vez.
          if git fetch --depth 1 origin "$RAMA" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD -- metrics/; then
            echo "La rama $RAMA ya tiene esta foto."
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/$RAMA"
          URL="https://github.com/$REPO/pull/new/$RAMA"
          echo "La foto de $MES está en la rama $RAMA. Abre el PR: $URL" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$REPO" \
            --title "La foto de $MES está lista para fusionar" \
            --body "La foto del mes está en la rama \`$RAMA\`. Abre el PR y fusiónalo: $URL"
