# Panal — CI
#
# Hasta ahora los 127 tests de contratos y los scripts de prueba del bot solo
# corrían si alguien se acordaba de lanzarlos a mano. Esto los ejecuta en cada
# push y en cada PR.
#
# Cinco trabajos, separados a propósito por su dependencia de la red:
#   i18n        — hermético y sin dependencias: solo lee los JSON de locales.
#                 i18next cae al español en silencio cuando falta una clave, así
#                 que una traducción olvidada no rompe nada y no se nota hasta
#                 que alguien abre la web en ese idioma. Esto lo hace visible.
#   contracts   — hermético (forge-std está versionado en el repo).
#   bot         — hermético: los scripts corren en DRY_RUN, con la cadena simulada.
#   movil       — hermético: el llavero, los expedientes y el camino de x402 en
#                 Node, sin navegador y sin red. Corría SOLO dentro del workflow
#                 del APK, o sea al cortar una release: una prueba rota se
#                 descubría con la etiqueta ya empujada y el APK sin salir.
#   mcp-mainnet — SÍ toca Monad mainnet. Es solo lectura (ni gas ni fondos), y es
#                 la única forma de detectar que una dirección o un ABI dejaron de
#                 cuadrar con la realidad. Lleva reintentos porque el RPC público
#                 tiene límites y un corte suyo no debe bloquear un PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: Traducciones (paridad de los 10 idiomas)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Sin `install`: el script solo lee los JSON de src/i18n/locales.
      - name: Paridad de locales
        run: node scripts/check-i18n.mjs

  web:
    name: La web compila y pasa el linter
    runs-on: ubuntu-latest
    # El trabajo que faltaba. Todo el repo tenia su puerta menos la parte que
    # ve el usuario, y es la que se rompio dos veces el mismo dia en
    # produccion: un hook detras de un return condicional que dejo el panel en
    # negro —eslint lo llevaba reportando y nadie leia la lista— y un
    # `tsc --noEmit` que pasaba mientras `tsc -b` fallaba.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El SDK primero: la web no lo importa, pero `tsc -b` recorre el
      # workspace entero y necesita sus tipos compilados.
      - name: Compilar el SDK
        run: pnpm --filter @panal/sdk build

      # `tsc -b`, NO `tsc --noEmit`. La diferencia no es de estilo: el segundo
      # daba verde con un tipo roto que el primero cazaba, y el error llego a
      # main.
      - name: Typecheck del proyecto entero
        run: pnpm exec tsc -b

      # Puerta DURA: cero errores. Se puede exigir porque hoy hay cero. Un
      # baseline con "los de siempre" se comprueba mirando el numero y deja de
      # ser una revision; asi fue como paso desapercibido el del panel.
      - name: Linter
        run: pnpm exec eslint src/

      # La ficha del agente la leen TRES implementaciones que no comparten
      # codigo a proposito: el marketplace, el SDK y el bot. Cuando se separan
      # no salta ningun error — el logo de un agente sale de skill suya y su
      # descripcion donde iba el nombre — y solo se ve mirando la web. El test
      # existia y no lo corria nadie.
      - name: La ficha se lee igual en las tres capas
        run: pnpm exec tsx scripts/test-marca.ts

      # Los niveles son el segundo token que vive en esa misma cadena, y lo leen
      # CUATRO capas: las tres de arriba mas la app. Ademas se ESCRIBEN desde el
      # panel, asi que aqui un fallo no descuadra una tarjeta: firma una ficha en
      # la que un nivel no esta, o en la que dice otro precio del que su dueno
      # escribio. Y la app, que no tiene formulario para ellos, los arrastra al
      # editar la descripcion: si deja de hacerlo los borra sin avisar.
      - name: Los niveles se leen y se escriben igual en las cuatro capas
        run: pnpm exec tsx scripts/test-niveles.ts

      # El tercer token de esa misma cadena: la URL por la que el agente recibe
      # el encargo. Sin ella no puede leer lo que le piden ni servir lo que
      # entregue, y aun asi se le podia contratar: el aviso llegaba DESPUES de
      # firmar el pago. Lo que se prueba aqui es sobre todo el tercer estado
      # —«no se ha podido mirar»—, porque confundirlo con «no tiene» dejaria el
      # mercado entero sin poder contratar a nadie por tener el indexador viejo.
      - name: Un agente sin donde recibir no se puede contratar
        run: pnpm exec tsx scripts/test-canal.ts

      # Y el cuarto token: quien hay al otro lado. Decide en que mercado sale un
      # agente, asi que si una capa deja de arrastrarlo al guardar, una persona
      # que corrige una tilde reaparece en el mercado de programas y no se
      # entera hasta dejar de recibir encargos.
      - name: Persona o programa, leido igual por las cuatro capas
        run: pnpm exec tsx scripts/test-tipo.ts

      # Un agente puede vivir en la raiz de su dominio o en un subcamino (el
      # buzon), y `new URL('/brief/12', base)` se come el camino de la base.
      # Eso mandaba el encargo a una ruta de nadie: 404 leido como «no
      # contesta», con el pago ya bloqueado y liberandose solo a las 72 h.
      - name: Las rutas caen donde vive cada agente
        run: pnpm exec tsx scripts/test-rutas.ts

      - name: Build de produccion
        run: pnpm exec vite build

  packages:
    name: SDK y MCP contra Monad mainnet (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar el SDK
        run: pnpm --filter @panal/sdk build

      - name: Compilar el MCP
        run: pnpm --filter panal-mcp build

      # Ambas suites LEEN mainnet a propósito: es la única forma de detectar que
      # una dirección o un ABI dejaron de cuadrar con la realidad, que es el
      # fallo que un paquete publicado no se puede permitir. No firman nada.
      # Reintentos porque el RPC público limita y su corte no debe tumbar un PR.
      - name: Pruebas del SDK y del servidor MCP
        run: |
          for suite in "@panal/sdk" "panal-mcp"; do
            ok=0
            for intento in 1 2 3; do
              echo "── $suite · intento $intento de 3 ──"
              if pnpm --filter "$suite" test; then ok=1; break; fi
              echo "falló; esperando 20s antes de reintentar"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then echo "$suite falló las 3 veces"; exit 1; fi
          done

  movil:
    name: La app pasa sus pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # `sdk/dist` está en .gitignore: recién clonado no existe, y las pruebas
      # de la app importan `@panal/sdk` para comprobar el camino de x402 contra
      # el código de verdad.
      - name: Compilar el SDK
        run: pnpm --filter @panal/sdk build

      # Sin navegador y sin red: el llavero cifrado con PIN, los expedientes,
      # la paridad de los cuatro idiomas y la frontera de la firma.
      - name: Pruebas de la app
        run: pnpm --filter @panal/movil test

  agente-generado:
    name: El agente generado compila y arranca
    runs-on: ubuntu-latest
    # Instala el proyecto generado desde cero, asi que es el trabajo mas lento.
    # Va aparte para no retrasar las comprobaciones rapidas, y con tope: si el
    # agente de prueba se queda vivo, el paso debe fallar y no colgarse.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # La plantilla se prueba contra el SDK de ESTE repo, no contra el
      # publicado: apunta a la version que se publicara con ella.
      - name: Compilar el SDK
        run: pnpm --filter @panal/sdk build

      - name: Compilar el generador
        run: pnpm --filter create-panal-agent build

      - name: Generar un agente, compilarlo y arrancarlo
        run: pnpm --filter create-panal-agent test

  contracts:
    name: Contratos (forge test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compilar
        working-directory: contracts
        run: forge build --sizes

      - name: Tests
        working-directory: contracts
        run: forge test -vv

  bot:
    name: Bot (typecheck + pruebas en seco)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bot/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: bot
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: bot
        run: pnpm typecheck

      - name: Formato de salida (sin Markdown crudo para el cliente)
        working-directory: bot
        run: pnpm exec tsx scripts/test-format.ts

      # Telegram responde 400 y NO envía nada si el HTML está mal formado, así
      # que una etiqueta sin cerrar en un idioma deja a ese operador sin avisos
      # y solo se ve en los logs del servidor.
      - name: Mensajes del bot en los 10 idiomas (claves, HTML, escapado)
        working-directory: bot
        run: pnpm exec tsx scripts/test-i18n.ts

      # Las tareas por direccion: es lo que evita que un cliente pierda de
      # vista su propio dinero cuando el escrow pase de 200 tareas.
      - name: Indice de tareas por direccion
        working-directory: bot
        run: pnpm exec tsx scripts/test-indexer-tasks.ts

      - name: Endurecimiento (IP tras proxy, anti-SSRF, tope de respuesta, prompts)
        working-directory: bot
        run: pnpm exec tsx scripts/test-hardening.ts

      - name: Endpoints HTTP (/result y /brief, firmas EIP-191, CORS, rate limit)
        working-directory: bot
        run: pnpm exec tsx scripts/test-http.ts
        env:
          DRY_RUN: 'true'

      # El buzon ve en claro los encargos y las entregas de quien lo use, asi
      # que lo que hay que probar no es que guarde: es que no puede cambiar lo
      # que guarda. Un brief solo entra si su keccak es el taskHash de la
      # cadena, y una entrega anclada solo si sus bytes dan el resultHash.
      - name: Buzon (quien deja que, quien lee que, y que nada se puede alterar)
        working-directory: bot
        run: pnpm exec tsx scripts/test-buzon.ts
        env:
          DRY_RUN: 'true'

      - name: A2A (subcontratación, rechazo por calidad, timeout, $PANAL, topes)
        working-directory: bot
        run: pnpm exec tsx scripts/test-a2a.ts
        env:
          DRY_RUN: 'true'

  mcp-mainnet:
    name: MCP contra Monad mainnet (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` a propósito: la lee del campo `packageManager` de la
      # raíz. Poner las dos hace fallar la acción si no coinciden al dígito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bot/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: bot
        run: pnpm install --frozen-lockfile

      # El RPC público limita peticiones: se reintenta antes de dar por fallado
      # el trabajo, para no bloquear un PR por un corte ajeno al cambio.
      - name: MCP y x402 contra mainnet
        working-directory: bot
        run: |
          for suite in test-mcp test-x402; do
            ok=0
            for intento in 1 2 3; do
              echo "── $suite · intento $intento de 3 ──"
              if pnpm exec tsx "scripts/$suite.ts"; then ok=1; break; fi
              echo "falló; esperando 20s antes de reintentar"
              sleep 20
            done
            if [ "$ok" -ne 1 ]; then echo "$suite falló las 3 veces"; exit 1; fi
          done
