# Panal — el APK de Android
#
# Compila aquí y no en el servidor a propósito: el servidor de Panal es el que
# corre los cuatro agentes que cobran en mainnet, y meterle un JDK y ~2 GB de
# SDK de Android por una app es riesgo sin contrapartida. Los runners de GitHub
# ya traen todo eso instalado.
#
# El APK se firma con la CLAVE ESTABLE del repositorio si existe el secreto
# `PANAL_KEYSTORE_B64`, y con la clave de depuración que Android genera sola si
# no existe. La diferencia no es cosmética: solo con la clave estable se puede
# instalar una versión nueva encima de la anterior. Está explicado entero en
# `android/app/build.gradle`, junto a las huellas de los APK ya publicados.
#
# En los dos casos se instala activando "orígenes desconocidos".
#
# No corre en cada push. Un APK por commit no le sirve a nadie y son minutos de
# CI: se lanza a mano, o publicando una etiqueta `apk-v1.0.0`. Ojo: la app va
# DENTRO del APK, así que se queda congelada en el commit con el que se
# compiló — desplegar la web ya no toca los teléfonos, y son cosas distintas.

name: APK

on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
  # Crear la release desde la web de GitHub también crea la etiqueta, pero no
  # siempre dispara el evento `push`. Escuchando los dos, el APK se adjunta
  # tanto si la etiqueta se publica desde la terminal como desde el navegador.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    name: Compilar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # WALLETCONNECT ES OBLIGATORIO AQUI, no un extra.
      #
      # Dentro de un WebView no hay extensiones, o sea que no hay
      # `window.ethereum`, o sea que el conector `injected` —el unico que se
      # compilaba— no podia funcionar nunca. Los tres APK publicados salieron
      # con el boton de conectar muerto por esto: pulsarlo lanzaba
      # `ConnectorNotFoundError` y wagmi lo guardaba en un estado que nadie
      # miraba, asi que no pasaba absolutamente nada.
      #
      # El projectId NO es un secreto: viaja dentro del paquete y ya esta
      # publicado en el de la web (es el mismo). Se deja a la vista para que
      # compilar el APK funcione recien clonado el repositorio, y un secreto
      # del repositorio lo sustituye cuando convenga.
      #
      # Vale el mismo que la web porque la app se sirve desde
      # `https://panal.lat` —eso lo hace `server.hostname`—, asi que pasa la
      # misma restriccion por dominio del panel de Reown sin tocar nada alli.
      #
      # Va en el JOB y no en un paso porque el paso que comprueba el bundle
      # busca este valor EXACTO dentro del paquete.
      VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'ae5c70c560c02d8a26a18816f40ac0c9' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.14 y compileSdk 36 piden 17 como mínimo; 21 es la que
          # traen los runners y la que usa Android Studio hoy.
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El llavero cifra claves privadas y los expedientes deciden si una
      # entrega cuadra con la cadena. Las dos cosas se comprueban en Node, sin
      # navegador y sin red, y tienen que pasar ANTES de compilar nada: un APK
      # que guarde mal una semilla no se puede retirar de los telefonos.
      - name: Pruebas de la app
        run: pnpm --filter @panal/movil test

      # La version del APK sale de la etiqueta, para que no vuelva a haber tres
      # releases que por dentro dicen ser la misma. `versionCode` tiene que
      # CRECER siempre o Android no lo considera una actualizacion: 2.0.0 →
      # 20000, 2.1.3 → 20103. Aguanta hasta 99 en minor y patch.
      - name: Numerar la version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^apk-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
            if (( MINOR > 99 || PATCH > 99 )); then
              echo "minor y patch tienen que ser < 100 para que versionCode siga creciendo"; exit 1
            fi
            NOMBRE="${MAJOR}.${MINOR}.${PATCH}"
            CODIGO=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            # Ejecucion a mano: no es una release y tiene que notarse.
            NOMBRE="0.0-dev"; CODIGO=1
          fi
          # Se leen en los pasos de compilar, no en este: lo que se escribe en
          # GITHUB_ENV no existe todavia en el paso que lo escribe.
          #
          # Va ANTES de compilar la app —y no justo antes de Gradle, como
          # estaba— porque el menu de la app enseña la version, y para eso
          # `VITE_VERSION` tiene que existir cuando corre Vite. Si se numera
          # despues, el APK dice 2.1.0 por fuera y «compilacion de desarrollo»
          # por dentro.
          echo "VERSION_NAME=$NOMBRE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODIGO" >> "$GITHUB_ENV"
          echo "versionName=$NOMBRE  versionCode=$CODIGO"

      # Se compila la APP, no el sitio. Son proyectos distintos: `movil/` tiene
      # su propio Vite, su propio Tailwind y su propia interfaz.
      - name: Compilar la app
        run: pnpm --filter @panal/movil build
        env:
          # La misma que `versionName`: el menu de la app la enseña, y sin esto
          # diria «compilacion de desarrollo» en una release de verdad.
          VITE_VERSION: ${{ env.VERSION_NAME }}

      # Que no se cuele un APK con un bundle viejo o con el del sitio: sin los
      # archivos correctos la app abre una pantalla en blanco y eso solo se ve
      # ya en el teléfono.
      - name: Comprobar el bundle
        run: |
          test -f movil/dist/index.html
          test -d movil/dist/assets
          grep -q 'HeroSwarm' -r movil/dist && { echo 'ERROR: esto es el bundle de la web'; exit 1; } || true
          # Que no se vuelva a publicar un APK sin forma de conectar la wallet.
          #
          # Se busca el projectId EXACTO y no la palabra "walletconnect": esa
          # sale en el paquete de todas formas —el id del conector esta escrito
          # en la capa compartida— asi que como comprobacion no distingue nada.
          # El projectId, en cambio, solo acaba dentro si la variable llego al
          # build (config.ts:200); sin el, la app se instala, abre y no deja
          # entrar.
          grep -rqF "$VITE_WALLETCONNECT_PROJECT_ID" movil/dist/assets || {
            echo 'ERROR: el paquete no lleva el projectId de WalletConnect: el boton de conectar no haria nada'; exit 1; }
          echo "movil/dist: $(du -sh movil/dist | cut -f1), $(find movil/dist -type f | wc -l) archivos"

      - name: Sincronizar el proyecto Android
        run: pnpm exec cap sync android

      # El almacen de firma sale de un secreto y se escribe FUERA del arbol de
      # trabajo: dentro acabaria dentro del APK como recurso, y sobre todo
      # podria colarse en un commit. `RUNNER_TEMP` se borra al terminar.
      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_B64: ${{ secrets.PANAL_KEYSTORE_B64 }}
          # Solo para el diagnostico de abajo. NUNCA se imprime su valor: lo que
          # se dice es si llega y cuanto mide, que es lo que distingue las causas.
          KEYSTORE_PASS: ${{ secrets.PANAL_KEYSTORE_PASS }}
          # Si alguien lo pego en la pestana Variables en vez de en Secrets, es
          # aqui donde aparece. Estan juntas en la misma pantalla y se confunden.
          KEYSTORE_COMO_VARIABLE: ${{ vars.PANAL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "estable=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin PANAL_KEYSTORE_B64: este APK se firma con una clave de usar y tirar, distinta en cada ejecucion, y NO se podra instalar encima de una version anterior."

            # POR QUE ESTE DIAGNOSTICO. Tres releases seguidas salieron con clave
            # de usar y tirar mientras se daba el secreto por puesto: el aviso
            # decia QUE faltaba y nunca POR QUE, asi que cada intento costaba una
            # version quemada y una vuelta entera para descubrir lo mismo.
            #
            # Solo se imprimen longitudes y sies/noes. El valor de un secreto no
            # sale de aqui ni troceado: GitHub enmascara lo que reconoce, pero no
            # hay que fiar la clave de firma de la app a que acierte.
            echo "::group::Por que no llega"
            if [ -n "$KEYSTORE_COMO_VARIABLE" ]; then
              echo "CAUSA ENCONTRADA: PANAL_KEYSTORE_B64 esta en la pestana Variables, no en Secrets."
              echo "  Las dos pestanas viven en la misma pantalla y se confunden. Borralo de"
              echo "  Variables y crealo en Settings > Secrets and variables > Actions > Secrets."
            elif [ -n "$KEYSTORE_PASS" ]; then
              echo "PANAL_KEYSTORE_PASS SI llega a este job (${#KEYSTORE_PASS} caracteres), y PANAL_KEYSTORE_B64 no."
              echo "  O sea que los secretos del repositorio SI se ven aqui: el problema es de ESE nombre."
              echo "  Mira que este escrito exactamente PANAL_KEYSTORE_B64, sin espacios ni minusculas,"
              echo "  y que se guardara con contenido (un secreto vacio se acepta sin protestar)."
            else
              echo "NINGUNO de los dos secretos de firma llega a este job."
              echo "  Eso no es una errata en un nombre: es que este workflow no los ve. Suele ser"
              echo "  uno de estos tres:"
              echo "    - se crearon como Environment secret, y este job no declara environment:"
              echo "    - son secretos de ORGANIZACION con acceso por repositorios seleccionados,"
              echo "      y AgentHiv/Panal no esta en esa lista"
              echo "    - se pegaron en otro repositorio"
              echo "  Comprueba que salen listados en github.com/AgentHiv/Panal/settings/secrets/actions"
              echo "  bajo 'Repository secrets', no bajo 'Environment secrets' ni en otra pantalla."
            fi
            echo "::endgroup::"
            exit 0
          fi
          echo "PANAL_KEYSTORE_B64 llega: ${#KEYSTORE_B64} caracteres."
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Llega el almacen pero no PANAL_KEYSTORE_PASS. Gradle fallaria mas adelante con un error de contrasenas que no apunta aqui."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/panal.p12"
          # Que el secreto sea de verdad un almacen y no un pegote a medias: si
          # llega vacio, Gradle falla al final de la compilacion con un error de
          # contrasenas que no apunta a esto.
          test -s "$RUNNER_TEMP/panal.p12"
          echo "estable=si" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: android
        env:
          PANAL_KEYSTORE: ${{ steps.firma.outputs.estable == 'si' && format('{0}/panal.p12', runner.temp) || '' }}
          PANAL_KEYSTORE_PASS: ${{ secrets.PANAL_KEYSTORE_PASS }}
          PANAL_KEY_ALIAS: ${{ secrets.PANAL_KEY_ALIAS || 'panal' }}
        run: |
          # `release` solo cuando hay clave estable: sin ella saldria un APK sin
          # firmar, que no se puede instalar en ningun telefono.
          if [ -n "$PANAL_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Renombrar con la versión
        run: |
          if [ "${{ steps.firma.outputs.estable }}" = "si" ]; then
            ORIGEN=android/app/build/outputs/apk/release/app-release.apk
          else
            ORIGEN=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$ORIGEN" "panal-${GITHUB_REF_NAME//\//-}.apk"

      # El artefacto se descarga SIEMPRE dentro de un .zip; eso lo decide
      # GitHub y no se puede cambiar. En un teléfono es un problema real: al
      # tocarlo, Android abre el zip con lo que tenga asociado —un editor de
      # código, por ejemplo— y no hay forma de instalar nada. Sirve desde un
      # ordenador, donde descomprimir es trivial.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: panal-*.apk
          # Suficiente para repartirlo y probarlo; no es un almacén de releases.
          retention-days: 30

      # Para el teléfono, una RELEASE. Sus adjuntos se descargan tal cual, así
      # que tocar el enlace en Android baja un .apk de verdad y el sistema
      # ofrece instalarlo. Es la diferencia entre repartir la app y repartir un
      # zip que nadie sabe abrir.
      #
      # Solo al publicar una etiqueta: una ejecución a mano no crea releases,
      # que si no la lista se llena de versiones que no son versiones.
      - name: Publicar la release con el APK
        if: startsWith(github.ref, 'refs/tags/apk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="panal-${GITHUB_REF_NAME}.apk"
          if [ "${{ steps.firma.outputs.estable }}" = "si" ]; then
            FIRMA="Firmado con la clave estable de Panal: se instala encima de la versión anterior sin desinstalar nada."
          else
            FIRMA="ATENCIÓN: firmado con una clave de usar y tirar. Para instalarlo hay que DESINSTALAR antes la versión anterior, y eso se lleva por delante el llavero del teléfono. El secreto \`PANAL_KEYSTORE_B64\` del repositorio es lo que hace que deje de pasar."
          fi
          NOTAS="$FIRMA En el móvil: descárgalo y ábrelo; Android pedirá permiso para instalar de orígenes desconocidos.

          Es la app de Panal, no el sitio web dentro de una ventana: tres pestañas y su propia interfaz. Va entera dentro del APK, así que NO se actualiza sola — cada cambio necesita una versión nueva."

          # Crear o, si ya existe, adjuntar. Publicar la release desde la web
          # de GitHub la crea ANTES de que este paso corra, y entonces
          # `gh release create` falla con "already exists" y el APK se queda
          # sin subir — con la release publicada y vacía, que es peor que no
          # tenerla. `--clobber` deja reintentar la misma etiqueta.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Panal Android $GITHUB_REF_NAME" --notes "$NOTAS"
          fi

      # LA CLAVE NO SE REGENERA NUNCA. Si se pierde, ningun telefono que tenga
      # Panal instalado podra actualizarlo: habria que desinstalar y volver a
      # empezar, con el llavero cifrado del telefono por medio. Y si algun dia
      # esto llega a la Play Store, perderla significa no poder publicar mas
      # actualizaciones de esa aplicacion jamas.
      #
      # Se guarda fuera del repositorio y ademas en algun sitio que no sea este
      # servidor: los secretos de GitHub no se pueden volver a leer.
