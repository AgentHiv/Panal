# Panal — el APK de Android
#
# Compila aquí y no en el servidor a propósito: el servidor de Panal es el que
# corre los cuatro agentes que cobran en mainnet, y meterle un JDK y ~2 GB de
# SDK de Android por una app es riesgo sin contrapartida. Los runners de GitHub
# ya traen todo eso instalado.
#
# Sale un APK DE DEPURACIÓN, firmado con la clave de debug que Android genera
# sola. Se instala en cualquier teléfono activando "orígenes desconocidos", y
# es lo que hace falta para repartirlo y probarlo. Para la Play Store hace falta
# firmarlo con una clave propia: ver el paso comentado al final.
#
# No corre en cada push. Un APK por commit no le sirve a nadie y son minutos de
# CI: se lanza a mano, o publicando una etiqueta `apk-v1.0.0`. Ojo: la app va
# DENTRO del APK, así que se queda congelada en el commit con el que se
# compiló — desplegar la web ya no toca los teléfonos, y son cosas distintas.

name: APK

on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
  # Crear la release desde la web de GitHub también crea la etiqueta, pero no
  # siempre dispara el evento `push`. Escuchando los dos, el APK se adjunta
  # tanto si la etiqueta se publica desde la terminal como desde el navegador.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    name: Compilar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.14 y compileSdk 36 piden 17 como mínimo; 21 es la que
          # traen los runners y la que usa Android Studio hoy.
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Se compila la APP, no el sitio. Son proyectos distintos: `movil/` tiene
      # su propio Vite, su propio Tailwind y su propia interfaz.
      - name: Compilar la app
        run: pnpm --filter @panal/movil build

      # Que no se cuele un APK con un bundle viejo o con el del sitio: sin los
      # archivos correctos la app abre una pantalla en blanco y eso solo se ve
      # ya en el teléfono.
      - name: Comprobar el bundle
        run: |
          test -f movil/dist/index.html
          test -d movil/dist/assets
          grep -q 'HeroSwarm' -r movil/dist && { echo 'ERROR: esto es el bundle de la web'; exit 1; } || true
          echo "movil/dist: $(du -sh movil/dist | cut -f1), $(find movil/dist -type f | wc -l) archivos"

      - name: Sincronizar el proyecto Android
        run: pnpm exec cap sync android

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar con la versión
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "panal-${GITHUB_REF_NAME//\//-}.apk"

      # El artefacto se descarga SIEMPRE dentro de un .zip; eso lo decide
      # GitHub y no se puede cambiar. En un teléfono es un problema real: al
      # tocarlo, Android abre el zip con lo que tenga asociado —un editor de
      # código, por ejemplo— y no hay forma de instalar nada. Sirve desde un
      # ordenador, donde descomprimir es trivial.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: panal-*.apk
          # Suficiente para repartirlo y probarlo; no es un almacén de releases.
          retention-days: 30

      # Para el teléfono, una RELEASE. Sus adjuntos se descargan tal cual, así
      # que tocar el enlace en Android baja un .apk de verdad y el sistema
      # ofrece instalarlo. Es la diferencia entre repartir la app y repartir un
      # zip que nadie sabe abrir.
      #
      # Solo al publicar una etiqueta: una ejecución a mano no crea releases,
      # que si no la lista se llena de versiones que no son versiones.
      - name: Publicar la release con el APK
        if: startsWith(github.ref, 'refs/tags/apk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="panal-${GITHUB_REF_NAME}.apk"
          NOTAS="APK firmado en depuración. En el móvil: descárgalo y ábrelo; Android pedirá permiso para instalar de orígenes desconocidos.

          Es la app de Panal, no el sitio web dentro de una ventana: tres pestañas y su propia interfaz. Va entera dentro del APK, así que NO se actualiza sola — cada cambio necesita una versión nueva."

          # Crear o, si ya existe, adjuntar. Publicar la release desde la web
          # de GitHub la crea ANTES de que este paso corra, y entonces
          # `gh release create` falla con "already exists" y el APK se queda
          # sin subir — con la release publicada y vacía, que es peor que no
          # tenerla. `--clobber` deja reintentar la misma etiqueta.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Panal Android $GITHUB_REF_NAME" --notes "$NOTAS"
          fi

      # Cuando toque publicar en la Play Store, aquí va la firma de release.
      # Necesita un keystore propio, guardado como secreto del repositorio:
      #
      #   - name: Firmar
      #     env:
      #       KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      #       KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      #     run: |
      #       echo "$KEYSTORE_B64" | base64 -d > android/app/panal.keystore
      #       cd android && ./gradlew assembleRelease --no-daemon
      #
      # La clave NO se regenera: si se pierde, la Play Store no acepta más
      # actualizaciones de esa app nunca. Se guarda fuera del repositorio.
