# Panal — el APK de Android
#
# Compila aquí y no en el servidor a propósito: el servidor de Panal es el que
# corre los cuatro agentes que cobran en mainnet, y meterle un JDK y ~2 GB de
# SDK de Android por una app es riesgo sin contrapartida. Los runners de GitHub
# ya traen todo eso instalado.
#
# Sale un APK DE DEPURACIÓN, firmado con la clave de debug que Android genera
# sola. Se instala en cualquier teléfono activando "orígenes desconocidos", y
# es lo que hace falta para repartirlo y probarlo. Para la Play Store hace falta
# firmarlo con una clave propia: ver el paso comentado al final.
#
# No corre en cada push. Un APK por commit no le sirve a nadie y son minutos de
# CI: se lanza a mano, o publicando una etiqueta `apk-v1.0.0`.

name: APK

on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']

jobs:
  android:
    name: Compilar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.14 y compileSdk 36 piden 17 como mínimo; 21 es la que
          # traen los runners y la que usa Android Studio hoy.
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # `webDir` tiene que existir porque Capacitor lo copia dentro del APK,
      # pero la app NO usa esos archivos: carga https://panal.lat (ver
      # capacitor.config.ts, que explica por qué). En vez de meter 2,7 MB de
      # bundle que nadie va a abrir, va una página que lo dice — así, si algún
      # día alguien quita `server.url` y no compila la web, se encuentra este
      # texto en vez de una pantalla en blanco sin explicación.
      - name: Marcador en webDir
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Panal</title>
          <p>Esta app carga https://panal.lat. Si estás viendo esto, se ha
          quitado <code>server.url</code> de capacitor.config.ts sin compilar
          la web.</p>
          HTML

      - name: Sincronizar el proyecto Android
        run: pnpm exec cap sync android

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar con la versión
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "panal-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: panal-*.apk
          # Suficiente para repartirlo y probarlo; no es un almacén de releases.
          retention-days: 30

      # Cuando toque publicar en la Play Store, aquí va la firma de release.
      # Necesita un keystore propio, guardado como secreto del repositorio:
      #
      #   - name: Firmar
      #     env:
      #       KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      #       KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      #     run: |
      #       echo "$KEYSTORE_B64" | base64 -d > android/app/panal.keystore
      #       cd android && ./gradlew assembleRelease --no-daemon
      #
      # La clave NO se regenera: si se pierde, la Play Store no acepta más
      # actualizaciones de esa app nunca. Se guarda fuera del repositorio.
