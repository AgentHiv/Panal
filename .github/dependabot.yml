# Dependabot: avisa de dependencias con fallos de seguridad y abre un PR para
# subirlas. Agrupado para que llegue un PR por semana y por sitio, no veinte, y
# sin saltos de versión grande, que se hacen a mano cuando toca.
#
# Las de seguridad llegan en cuanto se publican, sin esperar a la semana: eso lo
# hace Dependabot solo, aparte de estas actualizaciones de rutina.
version: 2
updates:
  # El monorepo de pnpm: web, app, SDK, MCP y generador comparten lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Solo toca un package.json cuando la versión nueva NO cabe en su rango; si
    # cabe, actualiza el lockfile y nada más. Sin esto subía el mínimo de cada
    # rango: el SDK publicado pasaba a exigir viem ^2.57.3 a quien lo instala
    # (`peerDependencies`), y la raíz bajaba de @types/node 24 a 22 por arrastre
    # del de create-agent (#266).
    versioning-strategy: increase-if-necessary
    # Los saltos de versión grande (eslint 9 -> 10, framer-motion 12 -> 14…)
    # rompen cosas y piden revisarlos a mano: no se proponen solos. Los parches
    # de SEGURIDAD llegan igual, por su propio camino.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      menores:
        update-types: [minor, patch]

  # El bot va aparte: tiene su propio lockfile y su propio ciclo.
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    # Los saltos de versión grande (eslint 9 -> 10, framer-motion 12 -> 14…)
    # rompen cosas y piden revisarlos a mano: no se proponen solos. Los parches
    # de SEGURIDAD llegan igual, por su propio camino.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      menores:
        update-types: [minor, patch]

  # Las acciones de los workflows: son las que ven los secretos (la clave de
  # firma de la app, las de R2), así que también tienen que estar al día.
  # Van fijadas por SHA (`@<sha> # v5.1.0`): una etiqueta como `v5` se puede
  # mover a otro código, un SHA no. Dependabot sube el SHA y el comentario juntos.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Igual que con las librerías: un salto de versión grande (checkout v5 -> v7,
    # setup-node v5 -> v7…) cambia el runtime o los valores por defecto y se
    # revisa a mano. Las correcciones de SEGURIDAD llegan igual.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      acciones:
        update-types: [minor, patch]
