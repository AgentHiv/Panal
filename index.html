  <body>
    <div id="root"></div>

    <!--
      Red de seguridad para el arranque.

      Si algo revienta antes de que React monte, lo que queda es `#root` vacío
      sobre el fondo oscuro del sitio: una pantalla NEGRA, sin un solo mensaje.
      Desde fuera es indistinguible de que la app no cargue, y sin consola
      —dentro del WebView de un teléfono, por ejemplo— no hay forma de saber
      qué pasó. Ocurrió de verdad, y costó varias vueltas.

      Esto no arregla ningún fallo: lo enseña. Solo se activa si el error deja
      la página vacía, así que en funcionamiento normal no existe.
    -->
    <script>
      (function () {
        /**
         * Los textos, en los diez idiomas del sitio.
         *
         * Van AQUÍ DENTRO y no en `src/i18n` porque esto corre antes de que
         * exista el paquete: si el mensaje dependiera de i18next, el único
         * momento en que hace falta sería justo el momento en que no está.
         *
         * El orden de cada lista es fijo: 0-1 el aviso de lento, 2-4 el de red,
         * 5-7 el de fallo real. Se paga en bytes —unos 3 kB— y se cobra en que
         * alguien con mala cobertura lea lo que pasa en su idioma en vez de en
         * el mío.
         */
        var T = {"es":["Cargando Panal…","La conexión va lenta y el paquete sigue llegando.","Sin conexión.","No es el sitio: es la red.","No se ha podido descargar la aplicación.\nVuelve a cargar la página cuando tengas señal.","Panal no ha podido arrancar aquí.","Esto es lo que ha fallado. Si lo compartes, se puede arreglar:","La página cargó pero no llegó a arrancar, y no dio ningún error."],"en":["Loading Panal…","The connection is slow and the bundle is still arriving.","No connection.","Not the site — the network.","The app could not be downloaded.\nReload the page once you have signal.","Panal could not start here.","This is what failed. Share it and it can be fixed:","The page loaded but never started, and gave no error."],"pt":["A carregar o Panal…","A ligação está lenta e o pacote ainda está a chegar.","Sem ligação.","Não é o site: é a rede.","Não foi possível descarregar a aplicação.\nVolta a carregar a página quando tiveres sinal.","O Panal não conseguiu arrancar aqui.","Foi isto que falhou. Se o partilhares, pode ser corrigido:","A página carregou mas nunca arrancou, e não deu nenhum erro."],"fr":["Chargement de Panal…","La connexion est lente et le paquet arrive encore.","Pas de connexion.","Ce n'est pas le site : c'est le réseau.","L'application n'a pas pu être téléchargée.\nRecharge la page quand tu auras du signal.","Panal n'a pas pu démarrer ici.","Voici ce qui a échoué. Partage-le et ça pourra être corrigé :","La page s'est chargée mais n'a jamais démarré, sans aucune erreur."],"zh":["正在加载 Panal…","网络较慢，程序包仍在下载。","没有网络连接。","不是网站的问题，是网络。","应用无法下载。\n有信号后请重新加载页面。","Panal 无法在此启动。","这是失败的原因。分享它就能修复：","页面已加载但始终没有启动，也没有报错。"],"ru":["Загружаем Panal…","Соединение медленное, пакет ещё идёт.","Нет соединения.","Дело не в сайте, а в сети.","Не удалось загрузить приложение.\nОбновите страницу, когда появится сигнал.","Panal не смог здесь запуститься.","Вот что не сработало. Поделитесь — это можно починить:","Страница загрузилась, но так и не запустилась, и не выдала ошибку."],"ar":["جارٍ تحميل بَنَال…","الاتصال بطيء وحزمة التطبيق ما زالت تصل.","لا يوجد اتصال.","ليست المشكلة في الموقع بل في الشبكة.","تعذّر تنزيل التطبيق.\nأعد تحميل الصفحة عندما تتوفّر إشارة.","لم يتمكّن بَنَال من البدء هنا.","هذا ما فشل. شاركه ويمكن إصلاحه:","حُمِّلت الصفحة لكنها لم تبدأ قط، ولم تُظهر أي خطأ."],"hi":["Panal लोड हो रहा है…","कनेक्शन धीमा है और पैकेज अभी आ रहा है।","कोई कनेक्शन नहीं।","साइट नहीं, नेटवर्क है।","ऐप डाउनलोड नहीं हो सका।\nसिग्नल आने पर पेज फिर से लोड करें।","Panal यहाँ शुरू नहीं हो सका।","यह विफल हुआ। इसे साझा करें तो ठीक किया जा सकता है:","पेज लोड हुआ पर कभी शुरू नहीं हुआ, और कोई त्रुटि नहीं दी।"],"bn":["Panal লোড হচ্ছে…","সংযোগ ধীর, প্যাকেজ এখনও আসছে।","সংযোগ নেই।","সাইট নয়, নেটওয়ার্ক।","অ্যাপটি ডাউনলোড করা যায়নি।\nসিগন্যাল পেলে পাতাটি আবার লোড করুন।","Panal এখানে চালু হতে পারেনি।","এটিই ব্যর্থ হয়েছে। শেয়ার করলে ঠিক করা যাবে:","পাতা লোড হয়েছে কিন্তু চালু হয়নি, আর কোনো ত্রুটিও দেয়নি।"],"ur":["Panal لوڈ ہو رہا ہے…","کنکشن سست ہے اور پیکج ابھی آ رہا ہے۔","کوئی کنکشن نہیں۔","سائٹ نہیں، نیٹ ورک ہے۔","ایپ ڈاؤن لوڈ نہیں ہو سکی۔\nسگنل آنے پر صفحہ دوبارہ لوڈ کریں۔","Panal یہاں شروع نہیں ہو سکا۔","یہی ناکام ہوا۔ اسے شیئر کریں تو ٹھیک کیا جا سکتا ہے:","صفحہ لوڈ ہوا مگر کبھی شروع نہ ہوا، اور کوئی خرابی بھی نہ دی۔"]};
        // El respaldo es `es`, el mismo `fallbackLng` que `src/i18n/index.ts`.
        var idioma = (navigator.language || 'es').slice(0, 2).toLowerCase();
        var L = T[idioma] || T.es;
        var rtl = idioma === 'ar' || idioma === 'ur';

        var pintado = false;
        function escapar(s) {
          return String(s).replace(/[<>&]/g, function (c) {
            return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
          });
        }
        function vacio() {
          var root = document.getElementById('root');
          return !pintado && root && root.childNodes.length === 0 ? root : null;
        }
        function caja(dentro) {
          return (
            '<div dir="' + (rtl ? 'rtl' : 'ltr') + '" style="min-height:100vh;display:flex;align-items:center;' +
            'justify-content:center;padding:24px;font:14px/1.6 system-ui,-apple-system,sans-serif;' +
            'background:#0C0A12;color:#e8e8ea"><div style="max-width:34rem">' + dentro + '</div></div>'
          );
        }

        // Si React ya montó algo, el error es de otra cosa y no toca la
        // pantalla: tapar una app que funciona sería peor que el error.
        function mostrar(motivo, esRed) {
          var root = vacio();
          if (!root) return;
          pintado = true;
          root.innerHTML = caja(
            '<p style="font-size:1.15rem;margin:0 0 .5rem">' + escapar(esRed ? L[2] : L[5]) + '</p>' +
              '<p style="color:#9a9aa2;margin:0 0 1rem">' + escapar(esRed ? L[3] : L[6]) + '</p>' +
              '<pre style="white-space:pre-wrap;word-break:break-word;background:#17141f;border:1px solid #2a2536;' +
              'border-radius:10px;padding:12px;margin:0;font-size:12px;text-align:start">' +
              escapar(motivo) +
              '</pre>',
          );
        }

        // Un aviso suave, sin cara de avería y sin User-Agent: esto NO es un
        // fallo, es una espera. Se sustituye solo en cuanto React monta.
        function esperando() {
          var root = vacio();
          if (!root) return;
          root.innerHTML = caja(
            '<div style="text-align:center"><p style="font-size:1.05rem;margin:0 0 .4rem">' + escapar(L[0]) +
              '</p><p style="color:#9a9aa2;margin:0">' + escapar(L[1]) + '</p></div>',
          );
        }

        /**
         * ¿Llegó a descargarse el paquete de la aplicación?
         *
         * Es lo que separa «no hay red» de «hay un fallo en el código», y sin
         * mirarlo las dos se cuentan igual. `getEntriesByType('resource')` solo
         * lista lo que TERMINÓ de descargarse, así que si el módulo no está,
         * sigue en vuelo o no llegó nunca.
         */
        function paqueteDescargado() {
          if (!window.performance || !performance.getEntriesByType) return null; // no se sabe
          var r = performance.getEntriesByType('resource');
          for (var i = 0; i < r.length; i++) {
            if (/\/assets\/index-[^/]+\.js$/.test(r[i].name)) return true;
          }
          return false;
        }

        window.addEventListener('error', function (e) {
          mostrar((e.message || 'error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          mostrar((e.reason && e.reason.message) || e.reason || 'promesa rechazada');
        });

        /**
         * «No llegó», que es cosa de la red y no del sitio.
         *
         * La llama el `onerror` del <script type="module"> de abajo —al momento,
         * en cuanto el navegador sabe que la descarga falló— y también el plazo
         * largo, cuando el paquete sigue sin aparecer.
         */
        function sinRed() {
          mostrar(L[4], true);
        }
        window.__panalNoLlego = sinRed;

        // A los diez segundos NO se acusa a nadie: se dice que va lento, que es
        // lo único que se sabe. Antes aquí saltaba el mensaje de avería a los
        // doce, con el User-Agent y un «no dio ningún error» — y saltaba con
        // mala cobertura, que es cuando la app funciona perfectamente y solo
        // tarda. 950 kB a la velocidad de una barra de señal pasan de doce
        // segundos sin despeinarse.
        setTimeout(esperando, 10000);

        // Y a los cuarenta y cinco, ya sí, pero diciendo cuál de las dos cosas
        // pasó. Si el paquete no llegó a descargarse no hay nada que reportar
        // ni nada que arreglar en el código: es la red, y lo que toca es
        // reintentar.
        setTimeout(function () {
          if (paqueteDescargado() === false || navigator.onLine === false) return sinRed();
          mostrar(L[7] + '\n\n' + navigator.userAgent);
        }, 45000);
      })();
    </script>

    <!-- `onerror` para no esperar cuarenta y cinco segundos a saber algo que el
         navegador ya sabe: si la descarga del módulo falla, lo dice al momento.
         Va en el atributo y no con addEventListener porque el error puede
         ocurrir antes de que corra cualquier otro script. -->
    <script
      type="module"
      src="/src/main.tsx"
      onerror="window.__panalNoLlego && window.__panalNoLlego()"
    ></script>
  </body>
